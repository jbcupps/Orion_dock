[package]
name = "orion-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orion-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
orion-core = { path = "../orion-core" }
orion-birth = { path = "../orion-birth" }
orion-capabilities = { path = "../orion-capabilities" }
orion-router = { path = "../orion-router" }
orion-skills = { path = "../orion-skills" }
soul-forge = { path = "../soul-forge" }
uuid = { workspace = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"

# Skill plugins (compiled in, registered at startup as Verified)
skill-filesystem = { path = "../../skills/skill-filesystem" }
skill-http = { path = "../../skills/skill-http" }
skill-shell = { path = "../../skills/skill-shell" }
skill-web-search = { path = "../../skills/skill-web-search" }
skill-web-browse = { path = "../../skills/skill-web-browse" }
skill-perplexity-search = { path = "../../skills/skill-perplexity-search" }
skill-proton-mail = { path = "../../skills/skill-proton-mail" }