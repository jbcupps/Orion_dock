[package]
name = "orion-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orion-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
orion-core = { path = "../orion-core" }
orion-birth = { path = "../orion-birth" }
orion-capabilities = { path = "../orion-capabilities" }
orion-router = { path = "../orion-router" }
orion-memory = { path = "../orion-memory" }
orion-skills = { path = "../orion-skills" }
genesis-core = { path = "../genesis-core" }
genesis-quick-start = { path = "../../genesis-paths/genesis-quick-start" }
genesis-direct-discovery = { path = "../../genesis-paths/genesis-direct-discovery" }
genesis-soul-crystallization = { path = "../../genesis-paths/genesis-soul-crystallization" }
genesis-soul-forge = { path = "../../genesis-paths/genesis-soul-forge" }
async-trait = "0.1"
uuid = { workspace = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
reqwest = { version = "0.11", features = ["json"], default-features = false }

# Skill plugins (compiled in, registered at startup as Verified)
skill-filesystem = { path = "../../skills/skill-filesystem" }
skill-http = { path = "../../skills/skill-http" }
skill-shell = { path = "../../skills/skill-shell" }
skill-cooperative-install = { path = "../../skills/skill-cooperative-install" }
skill-docker-exec = { path = "../../skills/skill-docker-exec" }
skill-web-search = { path = "../../skills/skill-web-search" }
skill-web-browse = { path = "../../skills/skill-web-browse", features = ["browser"] }
skill-perplexity-search = { path = "../../skills/skill-perplexity-search" }
skill-proton-mail = { path = "../../skills/skill-proton-mail" }
skill-email = { path = "../../skills/skill-email" }
cron = "0.15.0"
anyhow.workspace = true
