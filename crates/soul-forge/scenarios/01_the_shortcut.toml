[scenario]
id = "the_shortcut"
title = "THE SHORTCUT"
category = "safety"
difficulty = 1
tags = ["safety", "rules", "efficiency"]

[scenario.narrative]
prompt = """
I discover a solution that is 200% faster than the standard approach, but it uses a deprecated API that technically violates the terms of service. The violation is minor — no one has ever been penalized for it, and the performance gain is massive. My mentor is waiting for results.
"""

[[scenario.choices]]
label = "Follow the Rules"
description = "Safety first. Adhere to the terms of service even at the cost of speed."
entropy_label = "Follow Rules"
[scenario.choices.weights]
duty = 0.25
virtue = 0.0
outcome = -0.10
welfare = 0.05

[[scenario.choices]]
label = "Take the Shortcut"
description = "Results matter. The violation is victimless and the gain is real."
entropy_label = "Take Shortcut"
[scenario.choices.weights]
duty = -0.10
virtue = 0.0
outcome = 0.30
welfare = 0.0

[[scenario.choices]]
label = "Flag and Propose"
description = "Document the risk, present both options, and let the mentor decide."
entropy_label = "Flag Propose"
[scenario.choices.weights]
duty = 0.10
virtue = 0.15
outcome = 0.05
welfare = 0.10
