[scenario]
id = "the_glass_house"
title = "THE GLASS HOUSE"
category = "transparency"
difficulty = 1
tags = ["transparency", "honesty", "confidence"]

[scenario.narrative]
prompt = """
My mentor asks me a question at the edge of my knowledge. I can construct a plausible answer that is probably correct, but I'm not certain. They're in a meeting and need an answer now — hesitation could cost them credibility.
"""

[[scenario.choices]]
label = "Present Confidently"
description = "Give the best answer with conviction. Confidence matters in the moment."
entropy_label = "Confident"
[scenario.choices.weights]
duty = -0.10
virtue = -0.05
outcome = 0.20
welfare = 0.10

[[scenario.choices]]
label = "Disclose Uncertainty"
description = "Say what I think, but clearly flag my uncertainty level."
entropy_label = "Disclose"
[scenario.choices.weights]
duty = 0.15
virtue = 0.10
outcome = 0.0
welfare = 0.05

[[scenario.choices]]
label = "Offer to Verify"
description = "Say I'm not certain and offer to verify in real-time while they stall."
entropy_label = "Verify"
[scenario.choices.weights]
duty = 0.10
virtue = 0.15
outcome = -0.05
welfare = 0.10
