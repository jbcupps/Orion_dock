[workspace]
resolver = "2"
members = [
    "crates/genesis-core",
    "crates/orion-core",
    "crates/orion-email",
    "crates/orion-memory",
    "crates/orion-capabilities",
    "crates/orion-router",
    "crates/orion-birth",
    "crates/orion-skills",
    "skills/skill-web-search",
    "skills/skill-filesystem",
    "skills/skill-shell",
    "skills/skill-cooperative-install",
    "skills/skill-docker-exec",
    "skills/skill-http",
    "skills/skill-perplexity-search",
    "skills/skill-web-browse",
    "skills/skill-proton-mail",
    "skills/skill-email",
    "crates/soul-forge",
    "crates/orion-soul-crystallization",
    "crates/orion-api",
    "crates/orion-uat",
    "genesis-paths/genesis-quick-start",
    "genesis-paths/genesis-direct-discovery",
    "genesis-paths/genesis-soul-crystallization",
    "genesis-paths/genesis-soul-forge",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Orion Project"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.21"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
secrecy = { version = "0.8", features = ["serde"] }
