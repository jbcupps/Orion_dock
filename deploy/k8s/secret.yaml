# Sensitive config. Fill DATABASE_URL (and optionally OPENAI_API_KEY) before apply.
# Example: kubectl create secret generic orion-secret --from-literal=DATABASE_URL='postgres://...' -n orion --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: orion-secret
  namespace: orion
  labels:
    app.kubernetes.io/name: orion
type: Opaque
stringData:
  # Required when MEMORY_BACKEND=postgres (e.g. postgres://user:pass@postgres:5432/orion)
  DATABASE_URL: "postgres://orion:CHANGE_ME@postgres:5432/orion"
  # Optional: enables cloud provider routes
  # OPENAI_API_KEY: ""
