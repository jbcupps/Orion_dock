http_port 3128
visible_hostname proxy_internal

# Keep logs compact and machine-parsable: ts client method url status bytes.
logformat orion_proxy %ts.%03tu %>a %rm %ru %>Hs %<st
access_log daemon:/var/log/squid/access.log orion_proxy

# Internal proxy is a pure forwarder in the chain; no local caching.
cache deny all
cache_mem 16 MB
maximum_object_size 0 KB
cache_store_log none

# Forward every request to the egress proxy.
cache_peer proxy_external parent 3129 0 no-query default login=PASSTHRU name=external_parent
never_direct allow all
prefer_direct off

http_access allow all
http_access deny all
