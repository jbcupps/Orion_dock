# Docker Compose for Orion: local dev and CI-like build validation.
# See documents/HOW_TO_RUN_LOCALLY.md.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d orion-dev   # start dev container
#   docker compose -f docker/docker-compose.yml exec orion-dev bash
#   docker compose -f docker/docker-compose.yml run --rm orion-build   # one-shot build+test
#
# Full stack (profile "full"): postgres, ollama, orion-api, frontend.
#   docker compose -f docker/docker-compose.yml --profile full up -d
#   Open http://localhost:3000 for the web UI (API is internal, proxied by nginx).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_dev
      POSTGRES_DB: orion
    volumes:
      - orion-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - full

  # Ollama: custom image pulls BIRTH_MODEL on startup so birth chat works on every deploy.
  ollama:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ollama
    image: orion-ollama:local
    environment:
      - BIRTH_MODEL=${BIRTH_MODEL:-qwen2.5:3b-instruct}
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    profiles:
      - full

  orion-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: orion-api:local
    expose:
      - "8080"
    volumes:
      - orion-data:/var/lib/orion
    environment:
      - ORION_DATA_DIR=/var/lib/orion
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      - ALLOWED_LLM_HOSTS=${ALLOWED_LLM_HOSTS:-ollama}
      - DATABASE_URL=${DATABASE_URL:-postgres://orion:orion_dev@postgres:5432/orion}
      - MEMORY_BACKEND=${MEMORY_BACKEND:-postgres}
      - BIRTH_MODEL=${BIRTH_MODEL:-qwen2.5:3b-instruct}
      - TOOLBOX_URL=${TOOLBOX_URL:-http://orion-toolbox:9090}
      - TOOLBOX_SECRET=${TOOLBOX_SECRET:-dev-secret}
      - ORION_MASTER_KEY=${ORION_MASTER_KEY:?Set ORION_MASTER_KEY (openssl rand -base64 32)}
      - ORION_BIND_ADDR=0.0.0.0:8080
      - ORION_CONTAINER=1
      - ORION_API_TOKEN=${ORION_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      orion-toolbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - full

  # Toolbox sidecar: pre-built container with common dev tools.
  # The agent dispatches commands here via HTTP when its lean runtime lacks
  # required utilities (git, python, wget, gcc, etc.).
  orion-toolbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.toolbox
    image: orion-toolbox:local
    volumes:
      - orion-data:/workspace/data
    environment:
      - TOOLBOX_SECRET=${TOOLBOX_SECRET:-dev-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: orion-frontend:local
    ports:
      - "3000:80"
    environment:
      - ORION_API_TOKEN=${ORION_API_TOKEN:-}
    depends_on:
      orion-api:
        condition: service_healthy
    profiles:
      - full

  orion-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: orion-dev:local
    volumes:
      - ..:/app
      - orion-cargo-cache:/app/target
    working_dir: /app
    stdin_open: true
    tty: true
    command: ["bash"]
    environment:
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      - ALLOWED_LLM_HOSTS=${ALLOWED_LLM_HOSTS:-ollama}
      - DATABASE_URL=${DATABASE_URL:-postgres://orion:orion_dev@postgres:5432/orion}
      - MEMORY_BACKEND=${MEMORY_BACKEND:-sqlite}
      - BIRTH_MODEL=${BIRTH_MODEL:-qwen2.5:3b-instruct}
    profiles:
      - dev

  orion-build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: orion-dev:local
    volumes:
      - ..:/app
      - orion-cargo-cache:/app/target
    working_dir: /app
    environment:
      - UAT_MODE=${UAT_MODE:-fast}
      - DATABASE_URL=${DATABASE_URL:-}
      - REPO_ROOT=/app
    command: ["bash", "-c", "bash /app/scripts/docker-test-suite.sh"]
    profiles:
      - build

volumes:
  orion-cargo-cache:
  orion-pgdata:
  ollama-models:
  orion-data:
