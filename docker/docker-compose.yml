# Docker Compose for Orion: local dev and CI-like build validation.
# See documents/HOW_TO_RUN_LOCALLY.md.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d orion-dev   # start dev container
#   docker compose -f docker/docker-compose.yml exec orion-dev bash
#   docker compose -f docker/docker-compose.yml run --rm orion-build   # one-shot build+test
#
# Full stack (profile "full"): postgres, ollama, orion-api, frontend, proxies.
#   docker compose -f docker/docker-compose.yml --profile full up -d
#   Open http://localhost:3000 for the web UI (API is internal, proxied by nginx).

x-proxy-env: &proxy_env
  HTTP_PROXY: http://proxy_internal:3128
  HTTPS_PROXY: http://proxy_internal:3128
  http_proxy: http://proxy_internal:3128
  https_proxy: http://proxy_internal:3128
  NO_PROXY: localhost,127.0.0.1,0.0.0.0,::1,ollama,postgres,orion-api,frontend,proxy_internal,proxy_external,orion-toolbox,nettest
  no_proxy: localhost,127.0.0.1,0.0.0.0,::1,ollama,postgres,orion-api,frontend,proxy_internal,proxy_external,orion-toolbox,nettest

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_dev
      POSTGRES_DB: orion
    volumes:
      - orion-pgdata:/var/lib/postgresql/data
    networks:
      - orion_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - full

  # Ollama: custom image pulls BIRTH_MODEL on startup so birth chat works on every deploy.
  ollama:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ollama
    image: orion-ollama:local
    networks:
      - orion_internal
    environment:
      <<: *proxy_env
      BIRTH_MODEL: ${BIRTH_MODEL:-qwen2.5:3b-instruct}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    profiles:
      - full
    depends_on:
      proxy_internal:
        condition: service_healthy

  orion-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: orion-api:local
    networks:
      - orion_internal
    expose:
      - "8080"
    volumes:
      - orion-data:/var/lib/orion
      - ./proxy/external/allowlist_domains.txt:/var/lib/orion/proxy/allowlist_domains.txt
      - ../.orion/proxy:/var/log/orion-proxy
    environment:
      <<: *proxy_env
      ORION_DATA_DIR: /var/lib/orion
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      ALLOWED_LLM_HOSTS: ${ALLOWED_LLM_HOSTS:-ollama}
      DATABASE_URL: ${DATABASE_URL:-postgres://orion:orion_dev@postgres:5432/orion}
      MEMORY_BACKEND: ${MEMORY_BACKEND:-postgres}
      BIRTH_MODEL: ${BIRTH_MODEL:-qwen2.5:3b-instruct}
      TOOLBOX_URL: ${TOOLBOX_URL:-http://orion-toolbox:9090}
      TOOLBOX_SECRET: ${TOOLBOX_SECRET:-dev-secret}
      ORION_MASTER_KEY: ${ORION_MASTER_KEY:?Set ORION_MASTER_KEY (openssl rand -base64 32)}
      ORION_BIND_ADDR: 0.0.0.0:8080
      ORION_CONTAINER: "1"
      ORION_API_TOKEN: ${ORION_API_TOKEN:-}
      ORION_PROXY_ALLOWLIST_PATH: /var/lib/orion/proxy/allowlist_domains.txt
      ORION_PROXY_LOG_DIR: /var/log/orion-proxy
      PROXY_MODE: ${PROXY_MODE:-allow_all}
      PROXY_ALLOW_HOST_DOCKER_INTERNAL: ${PROXY_ALLOW_HOST_DOCKER_INTERNAL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      orion-toolbox:
        condition: service_healthy
      proxy_internal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - full

  # Toolbox sidecar: pre-built container with common dev tools.
  # The agent dispatches commands here via HTTP when its lean runtime lacks
  # required utilities (git, python, wget, gcc, etc.).
  orion-toolbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.toolbox
    image: orion-toolbox:local
    networks:
      - orion_internal
    volumes:
      - orion-data:/workspace/data
    environment:
      <<: *proxy_env
      TOOLBOX_SECRET: ${TOOLBOX_SECRET:-dev-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full
    depends_on:
      proxy_internal:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: orion-frontend:local
    networks:
      - orion_internal
    environment:
      <<: *proxy_env
      ORION_API_TOKEN: ${ORION_API_TOKEN:-}
    depends_on:
      orion-api:
        condition: service_healthy
      proxy_internal:
        condition: service_healthy
    profiles:
      - full

  proxy_internal:
    image: ubuntu/squid:latest
    restart: unless-stopped
    profiles:
      - full
    networks:
      - orion_internal
      - orion_proxy_chain
    volumes:
      - ./proxy/internal/squid.conf:/etc/squid/squid.conf:ro
      - ../.orion/proxy/internal:/var/log/squid
    depends_on:
      proxy_external:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/squid.pid && kill -0 $(cat /run/squid.pid)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  proxy_external:
    image: ubuntu/squid:latest
    restart: unless-stopped
    profiles:
      - full
    networks:
      - orion_proxy_chain
      - orion_egress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROXY_MODE=${PROXY_MODE:-allow_all}
      - PROXY_ALLOW_HOST_DOCKER_INTERNAL=${PROXY_ALLOW_HOST_DOCKER_INTERNAL:-true}
      - PROXY_ALLOWLIST_FILE=/etc/squid/allowlist_domains.txt
      - PROXY_EXTRA_SAFE_PORTS=${PROXY_EXTRA_SAFE_PORTS:-}
    entrypoint: ["sh", "-c", "tr -d '\\015' < /etc/squid/entrypoint.sh | sh"]
    volumes:
      - ./proxy/external/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./proxy/external/allowlist_domains.txt:/etc/squid/allowlist_domains.txt:ro
      - ./proxy/external/entrypoint.sh:/etc/squid/entrypoint.sh:ro
      - ../.orion/proxy/external:/var/log/squid
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/squid.pid && kill -0 $(cat /run/squid.pid)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend_ingress:
    image: alpine/socat:latest
    profiles:
      - full
    command:
      - tcp-listen:3000,fork,reuseaddr,bind=0.0.0.0
      - tcp-connect:frontend:80
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - orion_internal
      - orion_egress

  ollama_ingress:
    image: alpine/socat:latest
    profiles:
      - full
    command:
      - tcp-listen:11434,fork,reuseaddr,bind=0.0.0.0
      - tcp-connect:ollama:11434
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - orion_internal
      - orion_egress

  postgres_ingress:
    image: alpine/socat:latest
    profiles:
      - full
    command:
      - tcp-listen:5432,fork,reuseaddr,bind=0.0.0.0
      - tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - orion_internal
      - orion_egress

  protonbridge_ingress:
    image: alpine/socat:latest
    profiles:
      - email
    command:
      - sh
      - -c
      - >
        socat TCP-LISTEN:1143,fork,reuseaddr,bind=0.0.0.0 TCP:host.docker.internal:1143 &
        socat TCP-LISTEN:1025,fork,reuseaddr,bind=0.0.0.0 TCP:host.docker.internal:1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - orion_internal
      - orion_egress
  nettest:
    image: curlimages/curl:8.12.1
    profiles:
      - full
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      <<: *proxy_env
    networks:
      - orion_internal
    depends_on:
      proxy_internal:
        condition: service_healthy

  orion-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: orion-dev:local
    volumes:
      - ..:/app
      - orion-cargo-cache:/app/target
    working_dir: /app
    stdin_open: true
    tty: true
    command: ["bash"]
    environment:
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      - ALLOWED_LLM_HOSTS=${ALLOWED_LLM_HOSTS:-ollama}
      - DATABASE_URL=${DATABASE_URL:-postgres://orion:orion_dev@postgres:5432/orion}
      - MEMORY_BACKEND=${MEMORY_BACKEND:-sqlite}
      - BIRTH_MODEL=${BIRTH_MODEL:-qwen2.5:3b-instruct}
    profiles:
      - dev

  orion-build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: orion-dev:local
    volumes:
      - ..:/app
      - orion-cargo-cache:/app/target
    working_dir: /app
    environment:
      - UAT_MODE=${UAT_MODE:-fast}
      - DATABASE_URL=${DATABASE_URL:-}
      - REPO_ROOT=/app
    command: ["bash", "-c", "bash /app/scripts/docker-test-suite.sh"]
    profiles:
      - build

volumes:
  orion-cargo-cache:
  orion-pgdata:
  ollama-models:
  orion-data:

networks:
  orion_internal:
    internal: true
  orion_proxy_chain:
    internal: true
  orion_egress:
